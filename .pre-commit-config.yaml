---
default_stages: [pre-commit, pre-push]

# Hooks never touch generated or third-party trees: Vale's synced
# style packages arrive via `vale sync` and follow upstream style.
exclude: ^\.vale/(Google|write-good|proselint|ai-tells.*)/

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        name: Check YAML files with yamllint
        entry: yamllint -c .yamllint.yaml --strict
        types: [yaml]

  - repo: https://github.com/vale-cli/vale
    rev: 405a7dabd73651d8ba24c72767a70c065aa6716a  # frozen: v3.19.0
    hooks:
      # Scope the pre-commit-stage hook to the file types .vale.ini
      # actually configures rules for (Markdown + Rust source). The
      # upstream hook defaults to types: [text], which passes every
      # text file plus .git/COMMIT_EDITMSG; vale then parses the
      # commit-message buffer as plain text (no extension), backticks
      # lose their code-span meaning, and rules like Google.Spacing
      # flag dotted identifiers even inside backticks. The
      # vale-commit-msg hook from proofhouse/pre-commit-hooks (below)
      # handles the commit message with a strip-and-vale pipeline that
      # drops git's helper comments and the verbose-diff scissors
      # block before invoking vale. Extend types_or when .vale.ini
      # grows a new section.
      - id: vale
        types_or: [markdown, rust]
        # Agent output template from the proofhouse package: one
        # machine-parseable line per finding.
        args: [--output=proofhouse-agent.tmpl]
        # CHANGELOG.md is generated by `cog changelog`, whose Title-Case
        # section headings ("Bug Fixes", "Continuous Integration") are a
        # cocogitto convention, not prose under this project's control.
        # The prose recipes (lint-prose, lint-markdown) already skip it
        # via --glob; .vale.ini cannot exempt it on its own because the
        # explicit per-rule toggles in [*.md] survive an empty
        # BasedOnStyles in the CHANGELOG.md block. Exclude it here too.
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 75cad3ecfe02b58e8165d3ac08d117bee207ed3d  # frozen: v0.2.43
    hooks:
      - id: rumdl-fmt
      - id: rumdl

  # Shared commit-msg gates. All four run on the commit-msg stage (see the
  # manifest); commitlint and commit-trailers need only bash/git, while
  # vale-commit-msg and cspell-commit-msg lean on this repo's vale/cspell
  # plus the commit-message scope in .vale.ini and .cspell.jsonc.
  # commitlint here is a bash port of the retired Go commitlint binary.
  # Pinned by SHA with a `# frozen:` tag comment so Renovate's pre-commit
  # manager tracks it, the same as the other hook repos above.
  - repo: https://github.com/proofhouse/pre-commit-hooks
    rev: 72e252992cbcdf4a503b7ce9145cdaf48bdc0cb9  # frozen: v0.3.0
    hooks:
      - id: commit-trailers
      - id: commitlint
      - id: vale-commit-msg
      - id: cspell-commit-msg

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|json5|css|svelte|vue|astro|graphql|gql)$"

      - id: tombi
        name: tombi (TOML lint + format-check)
        entry: just lint-toml
        language: system
        types: [toml]
        pass_filenames: false

      # The fixer runs here, the way the biome hook above rewrites what
      # it checks. Formatting has one right answer, so a hook that
      # applies it beats one that fails and hands the work back. CI
      # keeps the --check twin, which fires only if someone commits
      # around the hooks.
      - id: rustfmt
        name: rustfmt
        entry: just format-rs
        language: system
        types: [rust]
        pass_filenames: false

      # Held back to the push stage. Clippy compiles the crate and every
      # dependency it reads, so a cold cache turns one commit into a
      # multi-minute wait, and formatting is the only thing a commit
      # should have to survive. always_run because a lint level in
      # Cargo.toml or a threshold in clippy.toml changes the verdict on
      # source files the commit never touched.
      - id: clippy
        name: clippy
        entry: just lint-clippy
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      # Rendering the docs means compiling the crate and everything it
      # depends on first, which puts this hook on the same footing as
      # clippy above and out of the commit path for the same reason.
      - id: rustdoc
        name: rustdoc
        entry: just lint-docs
        language: system
        stages: [pre-push]
        pass_filenames: false

      # Third of the gates that has to compile before it can answer,
      # and the only one that then runs what it compiled. Building the
      # test targets from cold costs what clippy costs, which puts this
      # hook on the push stage beside the two above. always_run because
      # a test reads across the whole crate and the commit that breaks
      # one need never have touched a test file.
      - id: nextest
        name: nextest
        entry: just test
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      # Scoped to the manifest, where a dependency enters the tree and
      # where the fix for a finding goes. Dropping the last use of a
      # crate from a source file strands it as well, and CI reads that
      # case on the pull request. Nothing compiles here, so the hook is
      # cheap enough to stay on the commit path.
      - id: cargo-machete
        name: cargo-machete
        entry: just lint-machete
        language: system
        files: (^|/)Cargo\.toml$
        pass_filenames: false

      # A token scan with no build behind it, so this one keeps the
      # company of the manifest scan above rather than the two push
      # hooks. A clone belongs to a pair of files and not to either one
      # of them, which is why the hook hands over no filenames and lets
      # the recipe walk the sources itself.
      - id: jscpd
        name: jscpd
        entry: just lint-dup-code
        language: system
        types: [rust]
        pass_filenames: false

      # The header on a Rust source is a two-line comment, and nothing
      # so far has read it. reuse does, and it asks the same question
      # of every other tracked file as well, whether or not that file
      # holds code. New files are where the answer goes missing, and
      # any kind of file can be the new one, so this hook takes no
      # filter and no filenames.
      - id: reuse
        name: reuse lint
        entry: just lint-reuse
        language: system
        pass_filenames: false

      # Whitespace conventions from .editorconfig. The builtin
      # end-of-file-fixer / mixed-line-ending / trailing-whitespace
      # hooks above cover part of the same ground with fixed rules;
      # this one adds what they do not read at all — charset, the
      # tab-versus-space indent style, and the per-glob sections
      # .editorconfig declares. No file filter and no filenames: the
      # checker walks the git index itself, and the exclusions live in
      # .editorconfig-checker.json.
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: just lint-editorconfig
        language: system
        pass_filenames: false

      # Nothing else reads the Justfile's layout, so its formatting
      # drifts unless just's own formatter checks it. --check mode, to
      # match every other formatting hook here: report the drift and
      # fail rather than rewrite a file mid-commit. Run `just
      # format-just` to apply.
      - id: just-fmt
        name: just --fmt check
        entry: just lint-just
        language: system
        files: ^Justfile$
        pass_filenames: false

      # Runs the recipe rather than a bare cargo call, so the hook and
      # the CI job check the same thing.
      - id: lock-check
        name: Cargo.lock drift check
        entry: just lock-check
        language: system
        files: (^|/)Cargo\.(toml|lock)$
        pass_filenames: false

      # Tree-wide spell check at pre-commit and pre-push. Scoped off
      # the commit-msg stage so the cspell-commit-msg hook from
      # proofhouse/pre-commit-hooks owns the commit buffer with
      # worktree-safe config resolution.
      - id: cspell
        name: cspell
        entry: cspell --config .cspell.jsonc --no-summary --no-progress --no-must-find-files
        language: system
        stages: [pre-commit, pre-push]
        types: [text]
