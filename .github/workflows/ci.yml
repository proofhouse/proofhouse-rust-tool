---
# Main quality gate. Runs the lint set, the Cargo.lock drift check, and
# the test suite (matrixed across linux/macOS/windows native runners) on
# every pull request and every push to `main`. Each gate runs as its own
# job so a flake in one block does not require rerunning the others and
# the PR status surfaces which gate fired.
# The lint job draws on more than one toolchain. The text-quality set
# (vale, cspell, rumdl, biome, yamllint, tombi) comes from the Brewfile,
# as does the duplication scanner. The remaining gates that read Rust
# source come from the pinned compiler the job also sets up, and from
# the cargo linters installed beside it.
#
# Every job installs `just` from a SHA-pinned casey/just release
# archive, verifies it against the bundled SHA256SUMS, and then invokes
# the matching `just <recipe>` so the recipe is the single source of
# truth for what the gate runs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Invokes only the `lint` aggregator recipe, so the job stays
  # unchanged as new gates land — each gate appends itself to the
  # aggregator in the Justfile instead. `lint` and not a narrower
  # Rust-only recipe: the text-quality gates (prose, spelling, Markdown,
  # config, YAML, TOML) used to run only through the local pre-commit
  # hooks, which `git commit --no-verify` walks straight past, so
  # nothing on the merge path read them.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned toolchain from rust-toolchain.toml. Its own
      # caching is turned off so the rust-cache step below is the only
      # thing writing the cache, with the save policy this repo wants.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Pull requests restore the cache but never write it: a PR's
      # dependency set is transient, and letting every branch save
      # evicts the entries `main` builds from.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The ubuntu-24.04 image ships Homebrew but leaves its prefix off
      # the PATH, so expose the bin and sbin directories before any brew
      # invocation.
      - name: Put Homebrew on the PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      # The image pins an older Homebrew and sets HOMEBREW_NO_AUTO_UPDATE,
      # but `brew bundle` reads formula metadata from the JSON API, which
      # serves current definitions. ca-certificates now declares a `run`
      # install step that the pinned Homebrew cannot parse, failing every
      # formula that depends on it. Update Homebrew itself first.
      - name: Update Homebrew
        run: brew update

      # Brings in vale, cspell, rumdl, biome, yamllint, tombi, and jscpd.
      # Installing the whole file costs less than maintaining a second,
      # partial formula list, and the just and rustup entries it also
      # carries do no harm: the PATH export at the top of the Justfile
      # puts ~/.cargo/bin ahead of the Homebrew prefix, so the toolchain
      # set up above answers for cargo no matter which step ran first.
      # Guarding that ordering is the export's whole purpose.
      - name: Install Homebrew dependencies
        run: brew bundle install

      # Homebrew carries no formula for cargo-machete, so it arrives
      # from the crate's own release archive. The action checks that
      # download against the SHA256 it carries for the release before
      # unpacking it. The version is pinned rather than floating, and
      # the marker comment tells Renovate which crate to read; it has to
      # sit on the line above the input it describes for the pattern to
      # match.
      - name: Install cargo tools
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          # renovate: datasource=crate depName=cargo-machete
          tool: cargo-machete@0.9.2

      # Vale's style packages are downloaded, not vendored, so
      # `lint-prose` fails on a bare checkout without this. The narrow
      # recipe rather than `install-tools`: that one also installs the
      # cargo linters a development machine needs, and the step above
      # has already put a pinned build of those on this runner.
      - name: Sync Vale styles
        run: just vale-sync

      - name: Run lint gates
        run: just lint

  lock-check:
    name: lock-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned toolchain from rust-toolchain.toml.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Check lock drift
        run: just lock-check

  test:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    steps:
      # harden-runner only supports Linux runners; the macOS and Windows
      # slots run without it.
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned toolchain from rust-toolchain.toml. Its own
      # caching is turned off so the rust-cache step below is the only
      # thing writing the cache, with the save policy this repo wants.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Pull requests restore the cache but never write it: a PR's
      # dependency set is transient, and letting every branch save
      # evicts the entries `main` builds from.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The test runner publishes a build for every platform in the
      # matrix, and the action checks each download against the SHA256
      # the release carries before unpacking it. Renovate owns the
      # version, reading it from the marker comment on the line above.
      - name: Install cargo tools
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          # renovate: datasource=crate depName=cargo-nextest
          tool: cargo-nextest@0.9.140

      # The ci profile in .config/nextest.toml runs past the first
      # failure and writes a JUnit report. Naming it on the command line
      # rather than through an environment variable keeps the choice
      # visible in the step's own log.
      - name: Run tests
        run: just test --profile ci

      # Doctests are their own recipe because the test runner has no way
      # to reach them.
      - name: Run doctests
        run: just test-doc
