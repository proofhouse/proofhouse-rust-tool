---
# Main quality gate. Runs the lint set, the Cargo.lock drift check, the
# dependency policy audit, the test suite, the coverage measurement
# (both matrixed across linux/macOS/windows native runners), and a
# build under the oldest compiler the manifest supports on every pull
# request and every push to `main`. Each gate runs as its own job so a
# flake in one block does not require rerunning the others and the PR
# status surfaces which gate fired.
# The lint job draws on more than one toolchain. The text-quality set
# (vale, cspell, rumdl, biome, yamllint, tombi) comes from the Brewfile,
# as does the duplication scanner. The remaining gates that read Rust
# source come from the pinned compiler the job also sets up, and from
# the cargo linters installed beside it.
#
# Every job installs `just` from a SHA-pinned casey/just release
# archive, verifies it against the bundled SHA256SUMS, and then invokes
# the matching `just <recipe>` so the recipe is the single source of
# truth for what the gate runs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Invokes only the `lint` aggregator recipe, so the job stays
  # unchanged as new gates land — each gate appends itself to the
  # aggregator in the Justfile instead. `lint` and not a narrower
  # Rust-only recipe: the text-quality gates (prose, spelling, Markdown,
  # config, YAML, TOML) used to run only through the local pre-commit
  # hooks, which `git commit --no-verify` walks straight past, so
  # nothing on the merge path read them.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned toolchain from rust-toolchain.toml. Its own
      # caching is turned off so the rust-cache step below is the only
      # thing writing the cache, with the save policy this repo wants.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Pull requests restore the cache but never write it: a PR's
      # dependency set is transient, and letting every branch save
      # evicts the entries `main` builds from.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The ubuntu-24.04 image ships Homebrew but leaves its prefix off
      # the PATH, so expose the bin and sbin directories before any brew
      # invocation.
      - name: Put Homebrew on the PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      # The image pins an older Homebrew and sets HOMEBREW_NO_AUTO_UPDATE,
      # but `brew bundle` reads formula metadata from the JSON API, which
      # serves current definitions. ca-certificates now declares a `run`
      # install step that the pinned Homebrew cannot parse, failing every
      # formula that depends on it. Update Homebrew itself first.
      - name: Update Homebrew
        run: brew update

      # Brings in vale, cspell, rumdl, biome, yamllint, tombi, and jscpd.
      # Installing the whole file costs less than maintaining a second,
      # partial formula list, and the just and rustup entries it also
      # carries do no harm: the PATH export at the top of the Justfile
      # puts ~/.cargo/bin ahead of the Homebrew prefix, so the toolchain
      # set up above answers for cargo no matter which step ran first.
      # Guarding that ordering is the export's whole purpose.
      - name: Install Homebrew dependencies
        run: brew bundle install

      # Homebrew carries no formula for cargo-machete, so it arrives
      # from the crate's own release archive. The action checks that
      # download against the SHA256 it carries for the release before
      # unpacking it. The version is pinned rather than floating, and
      # the marker comment tells Renovate which crate to read; it has to
      # sit on the line above the input it describes for the pattern to
      # match.
      - name: Install cargo tools
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          # renovate: datasource=crate depName=cargo-machete
          tool: cargo-machete@0.9.2

      # Vale's style packages are downloaded, not vendored, so
      # `lint-prose` fails on a bare checkout without this. The narrow
      # recipe rather than `install-tools`: that one also installs the
      # cargo linters a development machine needs, and the step above
      # has already put a pinned build of those on this runner.
      - name: Sync Vale styles
        run: just vale-sync

      - name: Run lint gates
        run: just lint

  lock-check:
    name: lock-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned toolchain from rust-toolchain.toml.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Check lock drift
        run: just lock-check

  # The blocking half of the dependency security story: an advisory, a
  # license off the allow-list, a duplicate crate version, or a source
  # outside crates.io stops the merge here. The reporting half lands
  # in a workflow of its own, where a scanner writes findings to code
  # scanning rather than holding a pull request.
  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned toolchain from rust-toolchain.toml. Nothing is
      # compiled here — the checker resolves the graph through cargo
      # metadata — but the resolution answers on the same compiler the
      # rest of the gates use. Its own caching is turned off so the
      # rust-cache step below is the only thing writing the cache.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Pull requests restore the cache but never write it: a PR's
      # dependency set is transient, and letting every branch save
      # evicts the entries `main` builds from.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A development machine takes this one from the Brewfile; a runner
      # takes the crate's release archive, which the action checks
      # against the SHA256 the release carries before unpacking it. The
      # version is pinned rather than floating, and the marker comment
      # naming the crate has to sit on the line above the input it
      # describes for Renovate to read it.
      - name: Install cargo tools
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          # renovate: datasource=crate depName=cargo-deny
          tool: cargo-deny@0.20.2

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Check the dependency policy
        run: just audit

  test:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    # The property suite draws this many inputs per property, four times
    # what it draws when nothing sets the variable. A wider search costs
    # seconds on a suite this small, and the run someone waits on locally
    # is not the one worth widening. The coverage matrix leaves the count
    # alone: a branch turns up in the first handful of draws or not at
    # all, so more of them buy wall-clock rather than coverage.
    env:
      PROPTEST_CASES: "1024"
    steps:
      # harden-runner only supports Linux runners; the macOS and Windows
      # slots run without it.
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned toolchain from rust-toolchain.toml. Its own
      # caching is turned off so the rust-cache step below is the only
      # thing writing the cache, with the save policy this repo wants.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Pull requests restore the cache but never write it: a PR's
      # dependency set is transient, and letting every branch save
      # evicts the entries `main` builds from.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The test runner publishes a build for every platform in the
      # matrix, and the action checks each download against the SHA256
      # the release carries before unpacking it. Renovate owns the
      # version, reading it from the marker comment on the line above.
      - name: Install cargo tools
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          # renovate: datasource=crate depName=cargo-nextest
          tool: cargo-nextest@0.9.140

      # The ci profile in .config/nextest.toml runs past the first
      # failure and writes a JUnit report. Naming it on the command line
      # rather than through an environment variable keeps the choice
      # visible in the step's own log.
      - name: Run tests
        run: just test --profile ci

      # Doctests are their own recipe because the test runner has no way
      # to reach them.
      - name: Run doctests
        run: just test-doc

  # Coverage runs a matrix of its own rather than riding the test job
  # above. The suite has to run on the toolchain the project ships, while
  # branch instrumentation answers only on a nightly compiler, and no
  # single job can be on both. The slots match the test matrix because a
  # branch only one platform takes still has to be reached by something,
  # and the fan-in below is what says whether it was.
  cover:
    name: "cover (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    steps:
      # harden-runner only supports Linux runners; the macOS and Windows
      # slots run without it.
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dated nightly channel the `coverage_toolchain` variable in the
      # Justfile names, repeated here because the action reads a channel
      # rather than a recipe. Nothing tracks the date, so the two move by
      # hand together. llvm-tools-preview supplies the profile reader the
      # coverage tool shells out to. Its own caching is off so the
      # rust-cache step below is the only thing writing the cache.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly-2026-08-01
          components: llvm-tools-preview
          cache: false

      # Pull requests restore the cache but never write it: a PR's
      # dependency set is transient, and letting every branch save
      # evicts the entries `main` builds from.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # Two installs rather than one step naming both tools: the marker
      # comment Renovate reads has to sit on the line above the `tool:`
      # input, and a list holding two entries leaves nowhere to put the
      # second one.
      - name: Install the test runner
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          # renovate: datasource=crate depName=cargo-nextest
          tool: cargo-nextest@0.9.140

      - name: Install the coverage tool
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          # renovate: datasource=crate depName=cargo-llvm-cov
          tool: cargo-llvm-cov@0.8.7

      # The runner label names the tracefile, which is how four slots land
      # four artifacts the fan-in can tell apart.
      - name: Measure coverage
        run: just cover "${{ matrix.os }}"

      # Retained for a day: the only consumer is the job below, and it
      # runs minutes after the upload.
      - name: Upload the tracefile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: lcov-${{ matrix.os }}.info
          if-no-files-found: error
          retention-days: 1

  # The authoritative reading. Each slot above already holds itself to
  # every region, and this job answers the question none of them can:
  # what the four runs reached between them, over one merged report.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    needs: cover
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # The diff check compares against the base branch, so the full
      # history has to come along rather than the default shallow clone.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Reads the pinned toolchain from rust-toolchain.toml. The nightly
      # compiler belongs to the measurement; reading the tracefile is
      # ordinary work for the shipping one.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # The diff check comes from PyPI, where no manager here reads a
      # version out of a workflow file. Bump this pin by hand when the
      # release notes give a reason to, the way the nightly channel above
      # is bumped.
      - name: Install the diff coverage check
        run: uv tool install diff-cover==10.4.1

      # lcov merges the per-slot reports. The runner image ships no copy
      # of it, and neither the coverage tool nor the task runner unions
      # two reports over the same source file.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install --yes lcov

      # merge-multiple drops every slot's tracefile back into the working
      # directory under the name it was written with, which is the glob
      # the combine recipe walks.
      - name: Download the tracefiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Merge the tracefiles and check the total
        run: just cover-combine

      # The merged total already holds the whole tree, so this fires only
      # where a change drops coverage on a line it touched — and then it
      # names that line instead of moving a total by a fraction.
      # github.base_ref exists on pull requests alone, which is what
      # scopes the step.
      - name: Check coverage on the changed lines
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          just cover-diff "origin/${{ github.base_ref }}"

  # The manifest names an oldest supported compiler, and every job above
  # builds on the pinned one instead, which sits a minor release ahead.
  # Nothing else here would notice a dependency bump or a language
  # feature that quietly moves the real floor past the declared one. One
  # runner settles it: the crate compiles the same source on all four
  # slots, so a floor holding on Linux holds on the rest.
  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned toolchain from rust-toolchain.toml. That
      # compiler reads the manifest and drives cargo hack; the check
      # itself lands on the floor toolchain a later step installs. Its
      # own caching is turned off so the rust-cache step below is the
      # only thing writing the cache.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Pull requests restore the cache but never write it: a PR's
      # dependency set is transient, and letting every branch save
      # evicts the entries `main` builds from.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Hands the check to the release the manifest declares. The action
      # checks the download against the SHA256 the release carries, and
      # Renovate owns the version through the marker on the line above
      # the input.
      - name: Install cargo tools
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          # renovate: datasource=crate depName=cargo-hack
          tool: cargo-hack@0.6.45

      # Which release to fetch comes out of the manifest, never out of
      # this file. A version written here would drift from Cargo.toml the
      # first time someone moved the floor, and the drift would read as a
      # passing gate on a compiler nothing declares. Every member inherits
      # one floor from the workspace table, so a second answer means the
      # manifest changed shape and the step stops rather than guessing
      # which one to trust.
      - name: Install the floor toolchain
        run: |
          floor=$(cargo metadata --format-version 1 --no-deps | jq -er '
            [.packages[].rust_version]
            | unique
            | if length == 1 then .[0]
              else error("members declare more than one floor") end')
          echo "Declared floor: $floor"
          rustup toolchain install "$floor" --profile minimal

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Check against the declared floor
        run: just lint-msrv-targets
